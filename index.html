<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1a24">
  <title>Mini Detective</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera">
    <h1>Mini Detective</h1>
    <nav id="navegacion" class="navegacion" hidden>
      <button class="pestana" data-pantalla="mansion">Mansión</button>
      <button class="pestana" data-pantalla="interrogatorio">Interrogar</button>
      <button class="pestana" data-pantalla="cuaderno">Cuaderno</button>
      <button class="pestana" data-pantalla="acusacion">Acusar</button>
    </nav>
  </header>

  <main>
    <section id="pantalla-inicio" class="pantalla">
      <h2>Un asesinato en la mansión</h2>
      <p id="introduccion" class="texto-caso"></p>
      <button id="boton-empezar" class="boton principal">Empezar la investigación</button>
    </section>

    <section id="pantalla-mansion" class="pantalla" hidden>
      <h2>La mansión</h2>
      <p class="ayuda">Elige una habitación para registrarla.</p>
      <p id="hallazgo" class="texto-caso" hidden></p>
      <div id="lista-habitaciones"></div>
    </section>

    <section id="pantalla-interrogatorio" class="pantalla" hidden>
      <h2>Interrogatorio</h2>
      <p class="ayuda">Elige a un sospechoso.</p>
      <div id="lista-sospechosos"></div>
      <div id="bloque-preguntas" hidden>
        <h3 id="titulo-preguntas"></h3>
        <p id="respuesta" class="texto-caso" hidden></p>
        <div id="lista-preguntas"></div>
      </div>
    </section>

    <section id="pantalla-cuaderno" class="pantalla" hidden>
      <h2>Cuaderno</h2>
      <h3>Pistas</h3>
      <div id="cuaderno-pistas"></div>
      <h3>Declaraciones</h3>
      <div id="cuaderno-respuestas"></div>
    </section>

    <section id="pantalla-acusacion" class="pantalla" hidden>
      <h2>Acusación</h2>
      <p class="ayuda">Solo tienes una oportunidad. Elige culpable, arma y habitación.</p>
      <h3>¿Quién?</h3>
      <div id="opciones-culpable" class="opciones"></div>
      <h3>¿Con qué?</h3>
      <div id="opciones-arma" class="opciones"></div>
      <h3>¿Dónde?</h3>
      <div id="opciones-habitacion" class="opciones"></div>
      <button id="boton-acusar" class="boton principal" disabled>Acusar</button>
    </section>

    <section id="pantalla-resultado" class="pantalla" hidden>
      <h2 id="titulo-resultado"></h2>
      <ul id="aciertos" class="aciertos"></ul>
      <h3>Lo que pasó realmente</h3>
      <p id="relato" class="texto-caso"></p>
      <button id="boton-nueva" class="boton principal">Nueva partida</button>
    </section>
  </main>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
